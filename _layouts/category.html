---
layout: default
---

<div class="space-y-8">
  <header class="border-b border-neutral-800 pb-6">
    <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-amber-400/10 text-amber-300 border border-amber-400/20 mb-3 uppercase tracking-wider">
      Category
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight mb-2">
      {{ page.title }}
    </h1>
    <p class="text-base text-neutral-400 max-w-3xl leading-relaxed">
      {{ page.description }}
    </p>
  </header>

  <!-- Interactive SPA Mount / Category List -->
  <div id="root">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      {% for game in site.games %}
        {% if game.category == page.id %}
          <a href="{{ game.url }}" class="group block p-4 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-amber-400/50 hover:bg-neutral-850 transition-all">
            <h3 class="font-bold text-white group-hover:text-amber-400 transition-colors mb-1 text-base">
              {{ game.title }}
            </h3>
            <p class="text-xs text-neutral-400 line-clamp-2 leading-relaxed">
              {{ game.summary }}
            </p>
          </a>
        {% endif %}
      {% endfor %}
    </div>
  </div>

  <div class="pt-6">
    {{ content }}
  </div>
</div>
